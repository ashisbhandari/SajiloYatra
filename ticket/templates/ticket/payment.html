{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SajiloYatra - Reservation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="{% static 'ticket/image/logoplease.png' %}" type="image/x-icon">
    <style>
        body {
            background: linear-gradient(135deg, #e0f7fa, #e1bee7);
            font-family: 'Arial', sans-serif;
        }
        h1 {
            text-align: center;
        }
        .gataway img {
            width: 100%;
            max-width: 150px;
            height: auto;
            margin: auto;
        }

        .hi {
            padding: 50px;
        }

        /* Flexbox container for payment options */
        .payment-options {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
        }

        .payment-options .payment-option {
            text-align: center;
            margin: 10px;
        }

        /* For mobile and smaller devices */
        @media (max-width: 768px) {
            .payment-options {
                flex-direction: column;
            }
        }
        .background-text {
            font-size: 5rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(0, 0, 0, 0.1);
            z-index: -1;
        }
        .payment-options {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
        }

        .payment-options .payment-option {
            text-align: center;
            margin: 10px;
        }
    </style>
</head>
<body>
    
   
    <section class="my-5">
        <div class="py-5 position-relative" id="service">
            <h1 class="background-text">Payment</h1>
            <h3 class="text-center">Payment Method</h3>
        </div>
        <center>
        <div class="col-md-6">
            <!-- Hidden Gateway Section -->
             
            <div class="row mb-3 gataway position-relative"">
                <div class="payment-options">
                    <div class="payment-option">
                        <a href="#"><img src="{% static 'ticket/image/esewaqr.png' %}" alt="Esewa"></a>
                        <p>Esewa</p>
                    </div>
                    <div class="payment-option">
                        <a href="#"><img src="{% static 'ticket/image/esewaqr.png' %}" alt="Khalti"></a>
                        <p>Khalti</p>
                    </div>
                    <div class="payment-option">
                        <a href="#"><img src="{% static 'ticket/image/esewaqr.png' %}" alt="IMEPay"></a>
                        <p>IMEPay</p>
                    </div>
                </div>
                <a href="/Book_ticket" class="btn btn-success mt-3">Check More</a>
            </div>
            </center>
        </div>
    </section>
</body>
</html>
