{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SajiloYatra - Reservation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="{% static 'ticket/image/logoplease.png' %}" type="image/x-icon">
    <style>
        body {
            background: linear-gradient(135deg, #e0f7fa, #e1bee7);
            font-family: 'Arial', sans-serif;
        }
        h1 {
            text-align: center;
        }
        .gataway img {
            width: 100%;
            max-width: 150px;
            height: auto;
            margin: auto;
        }

        .hi {
            padding: 50px;
        }

        /* Flexbox container for payment options */
        .payment-options {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
        }

        .payment-options .payment-option {
            text-align: center;
            margin: 10px;
        }

        /* For mobile and smaller devices */
        @media (max-width: 768px) {
            .payment-options {
                flex-direction: column;
            }
        }

    </style>
</head>
<body>
    {% include 'ticket/navbar.html' %}
    
    <div class="container hi">
        <h1>Book Your Ticket From<img src="{% static 'ticket/image/logoplease.png' %}" height="100px">
        <h1> </h1>
        {% comment %} <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="row mb-3">
        <input type="hidden" name="vech_no" value="{{ vech_vo }}">
        <div class="col-md-6">
            <label class="form-label"><b>Passenger Name<span style="color:red;">*</span></b></label>
            <input type="text" class="form-control" name="name" placeholder="Enter your name" required>
            
        </div>
        <div class="col-md-6">
            <label class="form-label"><b>Email Address <span style="color:red;">*</span></b></label>
            <input type="email" class="form-control" name="email" placeholder="you@example.com" required>
            
        </div>
    </div>
    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label"><b>Contact Number <span style="color:red;">*</span></b></label>
            <input type="tel" class="form-control" name="phone" pattern="\d{10}" maxlength="10" minlength="10" id="phone" placeholder="9800000000" required>
           
        </div>
        <div class="col-md-6">
            <label class="form-label"><b>Special Instructions</b></label>
            <textarea class="form-control" name="comments" placeholder="Any special instructions..."></textarea>
            
        </div>
    </div>
    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label"><b>Departure Time <span style="color:red;">*</span></b></label>
            <input type="date" class="form-control" name="departure_time" id="datePicker" placeholder="mm/ddewrgf/yy" required>
            
        </div>
    </div>

    <!-- Continue with the other fields -->

    <div class="row mb-3">
        <div class="col-md-12">
            <div class="row mb-3 gataway" id="hiddengateaway" style="display:none;">
                <h2>Payment Options</h2>
                <div class="payment-options">
                    <div class="payment-option">
                        <img src="{% static 'ticket/image/esewaqr.png' %}" alt="Esewa"></a>
                        <p>Esewa</p>
                    </div>
                    <div class="payment-option">
                        <a href="#"><img src="{% static 'ticket/image/esewaqr.png' %}" alt="Khalti"></a>
                        <p>Khalti</p>
                    </div>
                    <div class="payment-option">
                        <a href="#"><img src="{% static 'ticket/image/esewaqr.png' %}" alt="IMEPay"></a>
                        <p>IMEPay</p>
                    </div>
                </div>

                <br>
                <label for="paymentproof">Please provide Screenshot of payment which have done through Online<span style="color:red;">*</span></label>
                <input type="file" class="form-control" name="paymentproof" id="paymentproof" accept="image/*">
                
            </div>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-12">
            <button type="submit" class="btn btn-success w-100">Book Ticket</button>
        </div>
    </div>
</form> {% endcomment %}
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
  
    <!-- Include hidden vech_no -->
    <input type="hidden" name="vech_no" value="{{ vech_vo }}">
  
    <button type="submit">Submit</button>
  </form>
    </div>

    {% include 'ticket/footer.html' %}
</body>
</html>
