{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SajiloYatra - Seat</title>
    <link rel="icon" href="{% static 'ticket/image/logoplease.png' %}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .seat { display: flex; justify-content: center; align-items: center; padding-top: 20px; flex-direction: column; }
        .seat-line { display: flex; justify-content: center; gap: 80px; margin-bottom: 10px; }
        .last-line { display: flex; justify-content: center; gap: 10px; }
        .seat-line button, .last-line button { width: 50px; }
        .payment-container { display: flex; justify-content: center; padding: 10px; flex-direction: column; align-items: center; }
        .btn:focus { outline: none; box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25); }
    </style>
</head>
<body>
    <div class="seat">
        <div class="col-md-6">
            <div id="seatMessage" style="color: red; font-weight: bold; text-align: center; margin-bottom: 20px;">
                Please select a seat before proceeding.
            </div>
            <h2>Seats for Vehicle: {{ vehicle_no }}</h2>
            

            <div class="cabin">
                <div class="seat-line">
                    <style>
                        .available {
                            display: inline-block;
                            height: 20px;
                            width: 30px;
                            border: 2px solid green;
                            border-radius: 4px;
                            background-color: transparent;
                        }
                        .booked {
                            display: inline-block;
                            height: 20px;
                            width: 30px;
                            border: 2px solid red;
                            border-radius: 4px;
                            background-color: transparent;
                        }
                    </style>
                    
                    <div class="a">
                        <br><br>
                        <p><b><i>Door</i></b></p>
                        <p>Available=<span class="available"></span></p>
                        <p>Booked=<span class="booked"></span></p>
                    </div>
                    
                    <div class="b" style="padding-left: 60px;">
                        <img src="{% static 'ticket/image/driver.png' %}" alt="Driver" height="100px" width="100px">
                    </div>
                </div>
            </div><br>

            {% for row in seat_rows %}
            <div class="seat-line">
                <div class="a">
                    <button class="btn btn-outline-success selected-seat" id="{{ row }}1">{{ row }}1</button>
                    <button class="btn btn-outline-success selected-seat" id="{{ row }}2">{{ row }}2</button>
                </div>
                <div class="b">
                    <button class="btn btn-outline-success selected-seat" id="{{ row }}3">{{ row }}3</button>
                    <button class="btn btn-outline-success selected-seat" id="{{ row }}4">{{ row }}4</button>
                </div>
            </div>
            {% endfor %}

            <div class="last-line">
                {% for l in "12345" %}
                <button class="btn btn-outline-success selected-seat" id="L{{ l }}">L{{ l }}</button>
                {% endfor %}
            </div>

            <div class="payment-container">
                <a id="proceedLink" href="#">
                    <button id="proceedButton" class="btn btn-primary mt-3" disabled>Proceed to Payment</button>
                </a>
                <div id="selectedSeatInfo" class="mt-3" style="text-align: center; font-size: 18px;">
                    <b>Selected Seats (0):<br></b> None
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const bookedSeats = {{ booked_seats|safe }};  // List of booked seats from view
            const buttons = document.querySelectorAll(".selected-seat");
            const vehicleNo = "{{ vehicle_no }}";
            const proceedButton = document.getElementById("proceedButton");
            const seatMessage = document.getElementById("seatMessage");
            let selectedSeats = [];

            buttons.forEach((btn) => {
                const seatId = btn.id;

                if (bookedSeats.includes(seatId)) {
                    btn.classList.add("btn-outline-danger");
                    btn.disabled = true;
                    return;
                }

                btn.addEventListener("click", function () {
                    if (this.classList.contains("btn-success")) {
                        this.classList.remove("btn-success");
                        this.classList.add("btn-outline-success");
                        selectedSeats = selectedSeats.filter(seat => seat !== seatId);
                    } else {
                        if (selectedSeats.length < 5) {
                            this.classList.remove("btn-outline-success");
                            this.classList.add("btn-success");
                            selectedSeats.push(seatId);
                        } else {
                            alert("You can select a maximum of 5 seats only at a time.");
                        }
                    }

                    proceedButton.disabled = selectedSeats.length === 0;
                    updateSelectedSeatsDisplay();
                    document.getElementById("proceedLink").href = `/Book_ticket?seats=${selectedSeats.join(",")}&vech_no=${vehicleNo}`;
                    seatMessage.style.display = selectedSeats.length === 0 ? 'block' : 'none';
                });
            });

            function updateSelectedSeatsDisplay() {
                const seatInfo = document.getElementById("selectedSeatInfo");
                seatInfo.innerHTML = `<b>Selected Seats (${selectedSeats.length}):</b><br> ${selectedSeats.join(", ")}`;
            }
        });
    </script>
</body>
</html>
