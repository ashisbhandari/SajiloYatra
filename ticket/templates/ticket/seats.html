{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SajiloYatra-Seat</title>
    
    <link rel="icon" href="{% static 'ticket/image/logoplease.png' %}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .seat {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 20px;
            flex-direction: column;
        }
        .seat-line {
            display: flex;
            justify-content: center;
            gap: 80px;
            margin-bottom: 10px;
        }
        .last-line {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .seat-line button, .last-line button {
            width: 50px;
        }
        .payment-container {
            display: flex;
            justify-content: center;
            padding: 10px;
            flex-direction: column;
            align-items: center;
        }
        .btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
        }
    </style>
</head>
<body>
    <div class="seat">
        <div class="col-md-6">
            <div id="seatMessage" style="color: red; font-weight: bold; text-align: center; margin-bottom: 20px;">
                Please select a seat before proceeding.
            </div>
            <h2>Seats for Vehicle: {{ vehicle_no }}</h2>
            <h3 style="color: red;">Booked seat: 
                {% for cmp in page_obj %}
                <tr>
                    <td>{{ cmp.0}}{{cmp.1}}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="8" class="text-center">No data available</td>
                </tr>
                {% endfor %}
            <h3>
            <div class="cabin">
                <div class="seat-line">
                    <div class="a"><br><br><p><b><i>Door</i></b></p></div>
                    <div class="b" style="padding-left: 60px;">
                        <img src="{% static 'ticket/image/driver.png' %}" alt="Driver" height="100px" width="100px">
                    </div>
                </div>
            </div><br>

            {% for row in "ABCDEFGH" %}
            <div class="seat-line">
                <div class="a">
                    <button class="btn btn-outline-success selected-seat booked" id="{{ row }}1">{{ row }}1</button>
                    <button class="btn btn-outline-success selected-seat booked" id="{{ row }}2">{{ row }}2</button>
                </div>
                <div class="b">
                    <button class="btn btn-outline-success selected-seat booked" id="{{ row }}3">{{ row }}3</button>
                    <button class="btn btn-outline-success selected-seat booked" id="{{ row }}4">{{ row }}4</button>
                </div>
            </div>
            {% endfor %}

            <div class="last-line">
                <button class="btn btn-outline-success selected-seat booked" id="L1">L1</button>
                <button class="btn btn-outline-success selected-seat booked" id="L2">L2</button>
                <button class="btn btn-outline-success selected-seat booked" id="L3">L3</button>
                <button class="btn btn-outline-success selected-seat booked" id="L4">L4</button>
                <button class="btn btn-outline-success selected-seat booked" id="L5">L5</button>
            </div>

            <div class="payment-container">
                <a id="proceedLink" href="#">
                    <button id="proceedButton" class="btn btn-primary mt-3" disabled>Proceed to Payment</button>
                </a>
                <div id="selectedSeatInfo" class="mt-3" style="text-align: center; font-size: 18px;">
                    <b>Selected Seats (0):<br></b> None
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const buttons = document.querySelectorAll(".selected-seat");
            const vehicleNo = "{{ vehicle_no }}"; 
            const proceedButton = document.getElementById("proceedButton");
            const seatMessage = document.getElementById("seatMessage");
            let selectedSeats = [];

            buttons.forEach((btn) => {
                btn.addEventListener("click", function () {
                    const seatId = this.id;
                    if (this.classList.contains("btn-success")) {
                        this.classList.remove("btn-success");
                        this.classList.add("btn-outline-success");
                        selectedSeats = selectedSeats.filter(seat => seat !== seatId);
                    } else {
                        if (selectedSeats.length < 5) {
                            this.classList.remove("btn-outline-success");
                            this.classList.add("btn-success");
                            selectedSeats.push(seatId);
                        } else {
                            alert("You can select a maximum of 5 seats only at a time.");
                        }
                    }

                    proceedButton.disabled = selectedSeats.length === 0;
                    updateSelectedSeatsDisplay();

                    // ✅ Update URL with seats + vehicle number
                    const proceedLink = document.getElementById("proceedLink");
                    proceedLink.href = `/Book_ticket?seats=${selectedSeats.join(",")}&vech_no=${vehicleNo}`;

                    seatMessage.style.display = selectedSeats.length === 0 ? 'block' : 'none';
                });
            });

            proceedButton.addEventListener("click", function(event) {
                if (selectedSeats.length === 0) {
                    event.preventDefault();
                    alert("Please select seats before proceeding.");
                }
            });

            function updateSelectedSeatsDisplay() {
                const seatInfo = document.getElementById("selectedSeatInfo");
                seatInfo.innerHTML = `<b>Selected Seats (${selectedSeats.length}):</b><br> ${selectedSeats.join(", ")}`;
            }
        });
    </script>
</body>
</html>
